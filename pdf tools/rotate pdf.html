<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Rotation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #drop-zone {
            width: 300px;
            height: 200px;
            border: 2px dashed #007BFF;
            border-radius: 10px;
            text-align: center;
            line-height: 200px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #007BFF;
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }
        #drop-zone:hover {
            background-color: #e9f5ff;
        }
        #file-name {
            text-align: center;
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        #thumbnails {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .thumbnail-container {
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .thumbnail {
            width: 80px;
            height: 100px;
            margin: 5px;
            border: 2px solid #007BFF;
            cursor: pointer;
        }
        .selected {
            border-color: #FF5733;
        }
        .rotate-options {
            margin-top: 5px;
        }
        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #controls label {
            font-size: 16px;
            margin-bottom: 10px;
        }
        #rotate {
            font-size: 16px;
            padding: 10px 20px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #rotate:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="drop-zone">Drop PDF here</div>
    <div id="file-name"></div>
    <div id="thumbnails"></div>
    <div id="controls">
        <button id="rotate">Save Rotated PDF</button>
    </div>

    <!-- Include PDF-lib, PDF.js, and FileSaver.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileNameDisplay = document.getElementById('file-name');
            const rotateButton = document.getElementById('rotate');
            const thumbnailsContainer = document.getElementById('thumbnails');
            let pdfFile = null;
            let pdfjsDoc = null;
            let pdfDocLib = null;

            let pageRotations = [];

            dropZone.addEventListener('dragover', (event) => {
                event.preventDefault();
                dropZone.style.backgroundColor = '#e9f5ff';
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.style.backgroundColor = '#ffffff';
            });

            dropZone.addEventListener('drop', async (event) => {
                event.preventDefault();
                dropZone.style.backgroundColor = '#ffffff';

                const files = event.dataTransfer.files;
                if (files.length > 0 && files[0].type === 'application/pdf') {
                    pdfFile = files[0];
                    fileNameDisplay.textContent = `File: ${pdfFile.name}`;
                    await loadPdf(pdfFile);
                } else {
                    fileNameDisplay.textContent = 'Please drop a PDF file.';
                }
            });

            async function loadPdf(file) {
                // Reset thumbnails and rotations
                thumbnailsContainer.innerHTML = '';
                pageRotations = [];

                const arrayBuffer = await file.arrayBuffer();
                pdfDocLib = await PDFLib.PDFDocument.load(arrayBuffer);
                pdfjsDoc = await pdfjsLib.getDocument(arrayBuffer).promise;

                // Generate thumbnails
                for (let i = 0; i < pdfjsDoc.numPages; i++) {
                    const page = await pdfjsDoc.getPage(i + 1);
                    const thumbnailCanvas = document.createElement('canvas');
                    const viewport = page.getViewport({ scale: 0.2 });
                    thumbnailCanvas.height = viewport.height;
                    thumbnailCanvas.width = viewport.width;

                    const context = thumbnailCanvas.getContext('2d');
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    const imgElement = document.createElement('img');
                    imgElement.src = thumbnailCanvas.toDataURL();
                    imgElement.className = 'thumbnail';
                    imgElement.dataset.pageIndex = i;
                    imgElement.addEventListener('click', () => selectPage(i));

                    const rotationSelect = document.createElement('select');
                    rotationSelect.classList.add('rotate-options');
                    const options = [90, 180, 270];
                    options.forEach(deg => {
                        const option = document.createElement('option');
                        option.value = deg;
                        option.textContent = `${deg}°`;
                        rotationSelect.appendChild(option);
                    });

                    rotationSelect.addEventListener('change', () => {
                        const pageIndex = parseInt(imgElement.dataset.pageIndex);
                        pageRotations[pageIndex] = parseInt(rotationSelect.value);
                    });

                    const thumbnailContainer = document.createElement('div');
                    thumbnailContainer.classList.add('thumbnail-container');
                    thumbnailContainer.appendChild(imgElement);
                    thumbnailContainer.appendChild(rotationSelect);
                    thumbnailsContainer.appendChild(thumbnailContainer);

                    // Initialize the page rotation value to 0
                    pageRotations[i] = 0;
                }
            }

            function selectPage(pageIndex) {
                // Deselect any previously selected thumbnail
                document.querySelectorAll('.thumbnail').forEach(thumbnail => {
                    thumbnail.classList.remove('selected');
                });
                // Mark the new page as selected
                const selectedThumbnail = document.querySelector(`.thumbnail[data-page-index="${pageIndex}"]`);
                selectedThumbnail.classList.add('selected');
            }

            rotateButton.addEventListener('click', async () => {
                if (!pdfDocLib) {
                    alert('No PDF file loaded.');
                    return;
                }

                // Apply rotations to each page based on the user's selections
                const pages = pdfDocLib.getPages();
                for (let i = 0; i < pages.length; i++) {
                    const rotation = pageRotations[i];
                    const page = pages[i];
                    page.setRotation(PDFLib.degrees(rotation));
                }

                const pdfBytes = await pdfDocLib.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                saveAs(blob, `rotated_${pdfFile.name}`);
            });
        });
    </script>
</body>
</html>
